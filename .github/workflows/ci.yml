name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov

    - name: Lint codebase with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all style warnings without breaking build
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run pylint static analysis
      run: |
        pip install pylint
        pylint --disable=C,R --errors-only src/ lambda/handler.py cli.py

    - name: Run Checkov static analysis (Terraform/Kubernetes)
      uses: bridgecrewio/checkov-action@master
      with:
        framework: terraform,kubernetes
        soft_fail: true

    - name: Run unit tests with pytest coverage
      run: |
        python -m pytest --cov=src --cov-report=term --cov-report=xml
